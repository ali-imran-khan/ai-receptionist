<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Receptionist</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <div id="status" class="status">Idle</div>
      <a href="/admin" style="margin-left: auto; color: #60a5fa; text-decoration: none; padding: 8px 12px; border: 1px solid #60a5fa; border-radius: 6px;">Admin Panel</a>
    </div>
    <div class="log" id="log" style="display:none"></div>
    <ul id="appointments" style="display:none"></ul>
  </div>

  <script src="/app.js" type="module"></script>
  <noscript>This demo requires JavaScript.</noscript>
  <div id="tts-audio" style="display:none"></div>
  <audio id="audio" autoplay></audio>
  <script>
    // iOS autoplay hint
    document.body.addEventListener('touchstart', () => {
      const a = document.getElementById('audio');
      if (a) a.play().catch(()=>{});
    }, { once: true });
  </script>
  </body>
  </html>
